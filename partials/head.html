<!-- Shared head + masthead. Kept here so the five pages cannot drift apart;
     tools/build.py stamps it into each page between the BEGIN/END markers. -->

<!-- @@BOOT@@ -->
<script>
/* Runs before first paint. Three jobs, none of which may ever throw:
   1. apply a stored kit so the page never flashes the wrong palette
   2. mark that scripting exists, so JS-only controls can be styled in
      without shifting layout later
   3. arm the scroll reveal only when it can also be disarmed             */
(function(){try{
  var d=document.documentElement,s=null,k;
  try{s=window.localStorage}catch(e){}
  try{k=s&&s.getItem("ib-kit")}catch(e){}
  if(k&&/^(ember|crimson|deepsea|violet)$/.test(k))d.setAttribute("data-kit",k);
  d.className+=" js";
  if(window.requestAnimationFrame&&!matchMedia("(prefers-reduced-motion: reduce)").matches)
    d.className+=" reveal-ready";
}catch(e){}})();
</script>

<!-- @@MASTHEAD@@ -->

        <rect class="c" x="9.4" y="2.6" width="2.6" height="18.8"/>
